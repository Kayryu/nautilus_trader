[package]
name = "nautilus-deepx"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "DeepX integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_deepx"
crate-type = ["rlib"]

[features]
defi = ["nautilus-model/defi"]
extension-module = [
	"nautilus-common/extension-module",
	"nautilus-core/extension-module",
	"nautilus-infrastructure/extension-module",
	"nautilus-model/extension-module",
	"nautilus-network/extension-module",
	"pyo3/extension-module",
	"python",
]
python = [
	"dep:nautilus-system",
	"nautilus-common/python",
	"nautilus-core/python",
	"nautilus-infrastructure/python",
	"nautilus-model/python",
	"nautilus-network/python",
	"nautilus-system/python",
	"pyo3",
	"pyo3-stub-gen",
]

[dependencies]
deepx-rust-sdk = { workspace = true }
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-cryptography = { workspace = true }
nautilus-infrastructure = { workspace = true, features = ["postgres"] }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }
nautilus-system = { workspace = true, optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parity-scale-codec = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
subxt-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-common = { workspace = true, features = ["live"] }

alloy = { workspace = true }
aws-lc-rs = { workspace = true }
axum = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

