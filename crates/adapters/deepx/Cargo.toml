[package]
name = "nautilus-deepx"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "DeepX integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_deepx"
crate-type = ["rlib"]

[features]
extension-module = [
	"nautilus-common/extension-module",
	"nautilus-core/extension-module",
	"nautilus-infrastructure/extension-module",
	"nautilus-model/extension-module",
	"nautilus-network/extension-module",
	"pyo3/extension-module",
	"python",
]
python = [
	"dep:nautilus-system",
	"nautilus-common/python",
	"nautilus-core/python",
	"nautilus-infrastructure/python",
	"nautilus-model/python",
	"nautilus-network/python",
	"nautilus-system/python",
	"pyo3",
	"pyo3-stub-gen",
]

[dependencies]
nautilus-blockchain = { workspace = true }
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-cryptography = { workspace = true }
nautilus-infrastructure = { workspace = true, features = ["postgres"] }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }
nautilus-system = { workspace = true, optional = true }

alloy = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bon = { workspace = true }
frame-metadata = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parity-scale-codec = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sp-crypto-hashing = { workspace = true }
subxt-core = { workspace = true }
subxt-signer = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-common = { workspace = true, features = ["live"] }

axum = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "deepx-capture-runtime-fixtures"
path = "bin/capture_runtime_fixtures.rs"
doc = false

