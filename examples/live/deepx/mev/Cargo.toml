[package]
name = "deepx-mev"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
alloy-primitives = "=1.7.1"
anyhow = "1.0.104"
deepx-rust-sdk = { path = "../../../../deepx-rust-sdk" }
hex = "0.4"
parity-scale-codec = { version = "3.7.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
subxt-core = { version = "=0.44.0", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
rstest = "0.26.1"
